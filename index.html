<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15161a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Brain Dump" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Brain Dump</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If the app can't start (an error, or a browser too old for it), say so on screen
      // instead of leaving a blank page, so the message can be shared in a screenshot.
      (function () {
        function show(msg) {
          var root = document.getElementById("root");
          if (!root || root.childNodes.length) return;
          root.innerHTML =
            '<div style="font-family:system-ui,sans-serif;padding:32px 20px;max-width:520px;margin:auto">' +
            "<h2>Brain Dump couldn't start</h2><p>Please send a screenshot of this to Claude.</p>" +
            '<pre style="white-space:pre-wrap;font-size:12px;background:#eee;padding:12px;border-radius:8px"></pre></div>';
          root.querySelector("pre").textContent = msg + "\n\n" + navigator.userAgent;
        }
        window.addEventListener("error", function (e) {
          // Only our own scripts matter; a font that fails to load is fine.
          if (e.target && e.target.tagName && e.target.tagName !== "SCRIPT") return;
          show("Error: " + (e.message || (e.target && (e.target.src || e.target.href)) || "unknown"));
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          show("Error: " + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
        });
        setTimeout(function () { show("The app didn't load within 15 seconds."); }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
